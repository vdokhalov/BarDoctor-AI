name: Final BarDoctor checksum
on:
  push:
    branches: [codex-canonical-taxonomy-v336-sync]
permissions:
  contents: write
jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - shell: bash
        run: |
          while IFS=$'\t' read -r d target; do mkdir -p "$(dirname "$target")"; cat ".github/bardoctor-repair2/$d/"*.part | base64 --decode > "$target"; done < .github/bardoctor-repair2/manifest.tsv
          rm -rf .github/bardoctor-repair2 .github/workflows/bardoctor-source-repair2.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "chore: finalize exact BarDoctor checksum"
          git push origin HEAD:codex-canonical-taxonomy-v336-sync
