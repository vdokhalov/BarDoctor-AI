name: Finalize BarDoctor source sync
on:
  push:
    branches:
      - codex-canonical-taxonomy-v336-sync
permissions:
  contents: write
jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reconstruct exact source tree
        shell: bash
        run: |
          while IFS=$'\t' read -r source_dir target; do
            mkdir -p "$(dirname "$target")"
            cat ".github/bardoctor-sync/$source_dir/"*.part | base64 --decode > "$target"
          done < .github/bardoctor-sync/manifest.tsv
          rm -rf .github/bardoctor-sync
          rm -f .github/workflows/bardoctor-source-sync.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "chore: finalize exact BarDoctor source sync"
          git push origin HEAD:codex-canonical-taxonomy-v336-sync
