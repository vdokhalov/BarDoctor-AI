name: diagnostic-gate

on:
  pull_request:
    branches:
      - diagnostic/production-v400-ci-base-2026-09-02
  push:
    branches:
      - "diagnostic/**"

permissions:
  contents: read

concurrency:
  group: diagnostic-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.17.0
          cache: npm
      - name: Install locked dependencies
        run: npm run install:ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Full regression
        run: npm test
      - name: Build
        run: npm run build

  browser-critical:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.17.0
          cache: npm
      - name: Install locked dependencies
        run: npm run install:ci
      - name: Startup recovery QA
        run: npm run test:startup-recovery
      - name: iPhone navigation QA
        run: npm run test:mobile-navigation
        env:
          BD_QA_PROFILE: iphone-13
      - name: Pixel navigation QA
        run: npm run test:mobile-navigation
        env:
          BD_QA_PROFILE: pixel-7
      - name: Desktop write-offs QA
        run: npm run test:mobile-navigation
        env:
          BD_QA_PROFILE: desktop-chrome
          BD_QA_SCENARIO: writeoffs
      - name: Desktop embedded modules QA
        run: npm run test:mobile-navigation
        env:
          BD_QA_PROFILE: desktop-chrome
          BD_QA_SCENARIO: embedded-modules
      - name: Desktop shift write-offs QA
        run: npm run test:mobile-navigation
        env:
          BD_QA_PROFILE: desktop-chrome
          BD_QA_SCENARIO: shift-canonical-writeoffs
      - name: Desktop inventory delete QA
        run: npm run test:mobile-navigation
        env:
          BD_QA_PROFILE: desktop-chrome
          BD_QA_SCENARIO: inventory-delete
      - name: Desktop Business Health QA
        run: npm run test:mobile-navigation
        env:
          BD_QA_PROFILE: desktop-chrome
          BD_QA_SCENARIO: business-health-cold-start
