name: google-reviews-setup-v400

on:
  pull_request:
  push:
    branches:
      - main
      - rollback/stable-ui-v492
      - fix/design-system-v1-recovery
      - fix/health-curated-performance-v491
      - feat/phase4c-curated-doctor
      - fix/phase4-integrated-management-loop
      - fix/phase4b-management-flow
      - fix/phase4a-cost-resolution
      - fix/phase3a10-provenance
      - fix/phase3a9-health-inputs
      - fix/phase3a8-derived-metrics
      - fix/product-inventory-phase1
      - feature/google-reviews-setup-v400-2026-09-02
      - fix/google-oauth-top-level-v405-2026-09-03
      - fix/google-oauth-source-errors-v406-2026-09-03
      - fix/google-oauth-token-diagnostics-v407-2026-09-03
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: google-reviews-setup-v400-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-core:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
          cache: npm
      - name: Install locked dependencies
        run: npm run install:ci
      - name: Google, integrations, reviews, and RBAC tests
        run: |
          node --import tsx --test tests/google-business-setup-v400.test.ts tests/platform-integrations.test.ts tests/access-control.test.ts
          node --test tests/reviews-experience-v179.test.mjs tests/integrations-experience-v178.test.mjs
      - name: Phase 3A.1 actual-handler evidence resolver security and read-only regression
        run: node --import tsx --test tests/evidence-resolver-phase3a1.test.ts
      - name: Phase 3A.2 Revenue Trace canonical invariant finality binding tenant security and read-only
        run: node --import tsx --test tests/revenue-trace-phase3a2.test.ts
      - name: Phase 3A.3 captured cost recipe warehouse invariant binding RBAC and read-only
        run: node --import tsx --test tests/cost-warehouse-trace-phase3a3.test.ts
      - name: Phase 3A.4 Menu Origin real ingestion confirmation source binding RBAC and read-only
        run: node --import tsx --test tests/menu-origin-trace-phase3a4.test.ts
      - name: Phase 3A.5 source permissions, mixed reviews, provider identity and competing canonical writers
        run: node --import tsx --test tests/canonical-boundary-source-phase3a5.test.ts tests/canonical-boundary-review-phase3a5.test.ts tests/canonical-writer-safety-phase3a5.test.ts tests/google-review-source-phase3a5.test.ts
      - name: Phase 3A.6 scoped business day recorded Finance inputs and client contracts
        run: |
          node --import tsx --test tests/finance-inputs-phase3a6.test.ts
          node --test tests/finance-inputs-client-phase3a6.test.mjs tests/payroll-recorded-provider-phase3a6.test.mjs
      - name: Phase 3A.7 acquisition quantity valuation retention procurement and nested security
        run: node --import tsx --test tests/acquisition-stock-phase3a7.test.ts tests/stock-evidence-rca-phase3a7.test.ts
      - name: Phase 3A.8 verified month close, review denominators and native item analytics
        run: node --import tsx --test tests/derived-metrics-phase3a8.test.ts
      - name: Phase 3A.9 complete canonical Health inputs and operational source security
        run: node --import tsx --test tests/health-inputs-phase3a9.test.ts
      - name: Phase 3A.10 G05 G16 G18 canonical metric and context provenance accepted revisions RBAC
        run: node --import tsx --test tests/provenance-phase3a10.test.ts
      - name: Phase 4A real handler UNKNOWN cost episode verification history concurrency and venue isolation
        run: npm run test:management-cost
      - name: Phase 4B canonical management queue and authoritative day/stock checks
        run: node --import tsx --test tests/management-prioritization-phase4b.test.ts tests/management-actions-phase4b.test.ts
      - name: Phase 4C seven curated contracts, honesty, read-only and venue security
        run: npm run test:curated-doctor
      - name: Health Doctor performance contracts and isolated 5000-day budget
        run: |
          node --import tsx --test tests/health-doctor-performance.test.ts
          node --import tsx scripts/health-doctor-performance.mjs
      - name: Phase 4 integrated G1-G5 identities, stock stability and financial UNKNOWN controls
        run: node --import tsx --test tests/management-loop-targeted.test.ts
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Full regression and verified build
        run: npm test
      - name: Phase 5 repeated artifact preparation and receipt cost behavior
        run: node --test tests/phase5-artifact-preparation.test.mjs
      - name: Install Chromium for browser QA
        run: npm run browser:install
      - name: Phase 3A.1–3A.4 compiled Worker native D1 and evidence API mobile desktop
        run: |
          node --test tests/canonical-boundary-worker-phase3a5.test.mjs
          node --test tests/acquisition-stock-worker-phase3a7.test.mjs
          node --test tests/derived-metrics-worker-phase3a8.test.mjs
          node --test tests/health-inputs-worker-phase3a9.test.mjs
          node --test tests/provenance-worker-phase3a10.test.mjs
          node scripts/canonical-boundary-browser-phase3a5.mjs
          node --test tests/evidence-worker-phase3a1.test.mjs
          node --import tsx scripts/evidence-foundation-browser.ts
          node --import tsx scripts/cost-warehouse-trace-browser.ts
          node --import tsx scripts/menu-origin-trace-browser.ts
      - name: Stable v489 UI rollback and protected contracts
        run: |
          node --test tests/reference-slice-recovery.test.mjs tests/reference-slice-recovery-parity.test.mjs
          node --test tests/stable-ui-rollback.test.mjs
          node --import tsx scripts/stable-ui-rollback-browser.mjs
      - name: Phase 4C compiled Worker and curated Doctor 390 820 1280
        run: |
          node --test tests/curated-doctor-client-phase4c.test.mjs tests/curated-doctor-worker-phase4c.test.mjs
          node --import tsx scripts/curated-doctor-phase4c-browser.ts
      - name: Phase 4B management queue and real day editor 390 820 1280
        run: |
          node --test tests/management-actions-worker-phase4b.test.mjs
          npm run test:management-actions-browser
      - name: Health Doctor first repeat slow error and timeout states 390 820 1280
        run: node --import tsx scripts/health-doctor-performance-browser.mjs
      - name: Phase 4 integrated management loop real Tasks Inventory Day and Purchase UI
        run: node --import tsx scripts/management-loop-targeted-browser.ts
      - name: Phase 4A compiled Worker native D1 and real editor 390 820 1280 lifecycle
        run: |
          node --test tests/management-cost-worker-phase4a.test.mjs
          npm run test:management-cost-browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phase4a-cost-correction-evidence
          path: |
            outputs/stable-ui-rollback
            outputs/reference-slice-recovery
            outputs/curated-doctor-phase4c
            outputs/health-doctor-performance
            outputs/management-loop-targeted
            outputs/management-actions-phase4b
            outputs/management-cost-phase4a
            outputs/management-cost-correction-phase4a
      - name: Restricted Finance 403 actual client manager owner desktop mobile and strict error acceptance
        run: |
          BD_QA_MODE=regression BD_QA_LABEL=ci node scripts/restricted-manager-403-browser.mjs
          node scripts/restricted-manager-regression.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: restricted-manager-403-evidence
          path: outputs/restricted-manager-403
      - name: Phase 3A.6 isolated multi-session Finance report recorded payroll mobile tablet desktop
        run: node --import tsx scripts/finance-inputs-phase3a6-browser.ts
      - name: Phase 3A.7 isolated acquisition stock and historical cost mobile tablet desktop
        run: node --import tsx scripts/acquisition-stock-phase3a7-browser.ts
      - name: Phase 3A.10 Chromium metric source and integration accepted revisions 390 820 1280
        run: node --import tsx scripts/provenance-phase3a10-browser.ts
      - name: Phase 3A.9 Chromium canonical Health, source revisions, reload and venue switch
        run: node --import tsx scripts/health-inputs-phase3a9-browser.ts
      - name: Phase 3A.8 Chromium verified close, stale-tab rejection, review aggregate, reload and venue switch
        run: node --import tsx scripts/derived-metrics-phase3a8-browser.ts
      - name: Phase 3A.7 warehouse readiness and valuation coverage contract
        run: node --test tests/warehouse-readonly-client-phase3a7.test.mjs
      - name: Phase 3A.7 Chromium read-only warehouse navigation and venue switch
        run: node --import tsx scripts/warehouse-readonly-phase3a7-browser.ts
      - name: Operational Day Phase 1A mobile desktop with real isolated handlers
        run: |
          node --import tsx scripts/operational-day-browser.ts
          BD_OPERATIONAL_CACHED_PROFILE=1 node --import tsx scripts/operational-day-browser.ts
          BD_OPERATIONAL_TEST_INSTANT=2026-09-30T21:02:00Z node --import tsx scripts/operational-day-browser.ts
          BD_OPERATIONAL_TEST_INSTANT=2026-09-30T21:02:00Z BD_OPERATIONAL_CACHED_PROFILE=1 BD_OPERATIONAL_API_DELAY=600 node --import tsx scripts/operational-day-browser.ts
          BD_OPERATIONAL_TEST_INSTANT=2026-12-31T22:02:00Z BD_OPERATIONAL_CACHED_PROFILE=1 BD_OPERATIONAL_API_DELAY=600 node --import tsx scripts/operational-day-browser.ts
      - name: Actual compiled Worker and static client release integrity mobile desktop
        run: node --test tests/client-release-browser.test.mjs
      - name: Observability real bootstrap D1 and mobile desktop correlation QA
        run: BD_OBSERVABILITY_BROWSER_QA=1 node --test --test-concurrency=1 tests/request-observability-runtime.test.mjs tests/ingestion-d1-failure-runtime.test.mjs
      - name: Retain exact verified build for remaining browser gates
        uses: actions/upload-artifact@v4
        with:
          name: verified-browser-build-${{ github.sha }}
          path: dist/
          include-hidden-files: true
          if-no-files-found: error

  verify-browser:
    needs: verify-core
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
          cache: npm
      - name: Install locked dependencies
        run: npm run install:ci
      - name: Restore exact verified build from this run
        uses: actions/download-artifact@v4
        with:
          name: verified-browser-build-${{ github.sha }}
          path: dist/
      - name: Validate restored build integrity
        run: npm run validate:artifact
      - name: Install Chromium for browser QA
        run: npm run browser:install
      - name: Complete v489 navigation and functionality parity Chromium
        run: |
          node --import tsx scripts/reference-slice-recovery-parity.mjs
          node --import tsx scripts/reference-slice-legacy-doctor-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: recovery-parity-chromium
          path: |
            outputs/reference-slice-recovery/chromium
            outputs/reference-slice-recovery/legacy-doctor-chromium
      - name: Phase 2 unified menu ingestion mobile desktop isolated HTTP
        run: node --import tsx scripts/menu-ingestion-phase2-browser.ts
      - name: Phase 3 menu consumption browser QA
        run: npm run test:menu-consumption-browser
      - name: General tech card real server SQLite mobile desktop
        run: node --import tsx scripts/general-tech-card-browser-v440.ts
      - name: First venue setup registration wizard real server SQLite mobile desktop
        run: node --import tsx scripts/first-venue-setup-browser.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: recovery-first-venue-setup-evidence
          path: outputs/setup
      - name: Account and venue lifecycle real server SQLite mobile desktop
        run: node --import tsx scripts/account-lifecycle-browser.ts
      - name: Phase 4 purchase units mobile and desktop QA
        run: BD_QA_SCENARIO=phase4-conversion npm run test:procurement-browser
      - name: Phase 5 opening stock and CSV mobile desktop persisted HTTP QA
        run: node --import tsx scripts/opening-browser-qa-phase5.ts
      - name: Phase 5 sales mobile desktop persisted HTTP QA
        run: node --import tsx scripts/sales-browser-qa-phase5.ts
      - name: POS-1 cashier real sales handler SQLite mobile desktop QA
        run: node --import tsx scripts/pos1-browser-qa.ts
      - name: POS-1 hardening navigation drafts journal and retries mobile tablet desktop
        run: node --import tsx scripts/pos1-hardening-browser.ts
      - name: Sales UX step 2 journal checkout import mobile tablet desktop
        run: node --import tsx scripts/sales-ux2-browser.ts
      - name: Sales iPhone safe areas touch navigation and single shift regression
        run: |
          node --import tsx scripts/sales-iphone-browser.ts
          BD_IPHONE_NAV_ONLY=1 BD_IPHONE_REPEAT=3 BD_IPHONE_OUT=outputs/sales-iphone-hardening/normal node --import tsx scripts/sales-iphone-browser.ts
          BD_IPHONE_NAV_ONLY=1 BD_IPHONE_REPEAT=3 BD_IPHONE_DELAY=600 BD_IPHONE_OUT=outputs/sales-iphone-hardening/delayed node --import tsx scripts/sales-iphone-browser.ts
      - name: Venue timezone settings and Sales date mobile tablet desktop
        run: node --import tsx scripts/venue-timezone-browser.ts
      - name: Accounting report reversal guard mobile tablet desktop
        run: node --import tsx scripts/accounting-guard-browser.ts
      - name: Sales v454 overnight shifts and cashier auth network browser regression
        run: node --import tsx scripts/sales-observations-browser.ts
      - name: Startup recovery browser QA
        run: npm run test:startup-recovery
      - name: Anonymous mobile desktop startup handoff
        run: node --test tests/auth-splash-handoff-v423.test.mjs
      - name: Existing venue root startup without reload
        run: node --test tests/venue-root-splash-handoff.test.mjs
      - name: Purchase direct load and reload runtime
        run: node --test tests/purchase-reload-runtime.test.mjs
      - name: Mobile and desktop navigation QA
        run: npm run test:mobile-navigation
      - name: Home reviews viewport QA
        run: npm run test:home-reviews-browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sales-iphone-navigation-evidence
          path: outputs/sales-iphone-hardening

  sales-navigation:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
          cache: npm
      - run: npm run install:ci
      - name: Install Chromium and WebKit
        run: node node_modules/playwright-core/cli.js install --with-deps chromium webkit
      - name: Complete v489 navigation and functionality parity WebKit
        run: |
          BD_CURATED_BROWSER=webkit node --import tsx scripts/reference-slice-recovery-parity.mjs
          BD_CURATED_BROWSER=webkit node --import tsx scripts/reference-slice-legacy-doctor-browser.mjs
      - name: Design System V1 reference slice WebKit
        run: BD_CURATED_BROWSER=webkit node --import tsx scripts/stable-ui-rollback-browser.mjs
      - name: Phase 4C curated Doctor WebKit 390 820 1280
        run: BD_CURATED_BROWSER=webkit node --import tsx scripts/curated-doctor-phase4c-browser.ts
      - name: Health Doctor performance and bounded loading WebKit 390 820 1280
        run: BD_CURATED_BROWSER=webkit node --import tsx scripts/health-doctor-performance-browser.mjs
      - name: Phase 4 integrated management loop WebKit 390 820 1280
        run: BD_CURATED_BROWSER=webkit node --import tsx scripts/management-loop-targeted-browser.ts
      - name: Narrow WebKit environment classifier negative controls
        run: node --import tsx --test tests/webkit-environment-gate.test.ts
      - name: Mandatory stable WebKit Finance stock warehouse Health session APIs and RBAC 390 820 1280
        run: node scripts/webkit-stable-gate.mjs
      - name: Mandatory Phase 3A.10 stable WebKit metric source integration accepted revisions 390 820 1280
        run: BD_PROVENANCE_BROWSER=webkit node --import tsx scripts/provenance-phase3a10-browser.ts
      - name: Native process observation for the two allowlisted Health lifecycle suites
        run: |
          if ! command -v strace >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y strace
          fi
      - name: WebKit Health lifecycle PASS FAIL or evidenced ENVIRONMENT_BLOCKED
        run: node scripts/webkit-health-lifecycle-gate.mjs
      - name: Measured navigation and embedded auth failures
        run: |
          BD_PERF_LABEL=ci BD_PERF_DELAYS=0,100,300,600,600,600,1200 node --import tsx scripts/sales-navigation-performance.ts
          BD_PERF_LABEL=ci BD_PERF_BROWSER=webkit BD_PERF_DELAYS=0,100,300,600,600,600,1200 node --import tsx scripts/sales-navigation-performance.ts
          for width in 820 1280; do
            BD_PERF_LABEL=ci BD_PERF_WIDTH=$width BD_PERF_DELAYS=0 node --import tsx scripts/sales-navigation-performance.ts
            BD_PERF_LABEL=ci BD_PERF_WIDTH=$width BD_PERF_BROWSER=webkit BD_PERF_DELAYS=0 node --import tsx scripts/sales-navigation-performance.ts
          done
      - name: WebKit iPhone repeated pending Back navigation
        run: |
          BD_IPHONE_BROWSER=webkit BD_IPHONE_NAV_ONLY=1 BD_IPHONE_REPEAT=3 BD_IPHONE_OUT=outputs/sales-navigation-performance/ci/iphone-normal node --import tsx scripts/sales-iphone-browser.ts
          BD_IPHONE_BROWSER=webkit BD_IPHONE_NAV_ONLY=1 BD_IPHONE_REPEAT=3 BD_IPHONE_DELAY=600 BD_IPHONE_OUT=outputs/sales-navigation-performance/ci/iphone-delayed node --import tsx scripts/sales-iphone-browser.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sales-navigation-timings
          path: |
            outputs/sales-navigation-performance/ci
            outputs/finance-inputs-phase3a6/webkit
            outputs/health-inputs-phase3a9/webkit
            outputs/health-inputs-phase3a9/webkit-stable
            outputs/stable-ui-rollback
            outputs/reference-slice-recovery
            outputs/curated-doctor-phase4c
            outputs/health-doctor-performance
            outputs/webkit-health-lifecycle
            outputs/management-loop-targeted
            outputs/provenance-phase3a10
            outputs/webkit-stable-gate
            outputs/derived-metrics-phase3a8/webkit
            outputs/evidence-phase3a1/webkit
            outputs/cost-warehouse-phase3a3/webkit
            outputs/menu-origin-trace/webkit

  sales-scroll-layout:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
          cache: npm
      - run: npm run install:ci
      - name: Install Chromium and WebKit
        run: node node_modules/playwright-core/cli.js install --with-deps chromium webkit
      - name: First gesture and layout stability with isolated real handlers
        run: |
          BD_SCROLL_LABEL=ci-first BD_SCROLL_BROWSER=webkit BD_SCROLL_PROFILE=tablet BD_SCROLL_DELAYS=0 node --import tsx scripts/sales-scroll-layout-qa.ts
          BD_SCROLL_LABEL=ci-touch BD_SCROLL_BROWSER=chromium BD_SCROLL_PROFILE=safe BD_SCROLL_DELAYS=0 BD_SCROLL_TOUCH=1 node --import tsx scripts/sales-scroll-layout-qa.ts
          for browser in chromium webkit; do
            BD_SCROLL_LABEL=ci BD_SCROLL_BROWSER=$browser BD_SCROLL_PROFILE=safe node --import tsx scripts/sales-scroll-layout-qa.ts
            BD_SCROLL_LABEL=ci-clean BD_SCROLL_BROWSER=$browser BD_SCROLL_PROFILE=plain BD_SCROLL_DELAYS=1200 BD_SCROLL_CLEAN_IMPORT=1 node --import tsx scripts/sales-scroll-layout-qa.ts
            for profile in plain tablet desktop; do
              BD_SCROLL_LABEL=ci BD_SCROLL_BROWSER=$browser BD_SCROLL_PROFILE=$profile BD_SCROLL_DELAYS=0 node --import tsx scripts/sales-scroll-layout-qa.ts
            done
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sales-scroll-layout-evidence
          path: outputs/scroll-stability/ci*

  verify:
    if: always()
    needs: [verify-core, verify-browser, sales-navigation, sales-scroll-layout]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every application and browser gate
        env:
          REQUIRED_RESULTS: ${{ toJSON(needs) }}
        run: |
          node -e 'const jobs = JSON.parse(process.env.REQUIRED_RESULTS); for (const [name, job] of Object.entries(jobs)) { console.log(name + ": " + job.result); if (job.result !== "success") process.exitCode = 1; }'
