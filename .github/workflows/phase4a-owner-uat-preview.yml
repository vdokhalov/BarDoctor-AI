name: Phase 4A isolated owner UAT preview
on:
  push:
    branches: [qa/phase4a-owner-uat-preview]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  temporary-preview:
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
        with:
          path: control
      - uses: actions/checkout@v4
        with:
          ref: 3e6c6463d27579a088cefb66e1834d2afdc643c8
          path: candidate
      - uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
          cache: npm
          cache-dependency-path: candidate/package-lock.json
      - name: Install locked candidate dependencies
        working-directory: candidate
        run: npm run install:ci
      - name: Validate pinned candidate and install temporary tunnel
        working-directory: candidate
        run: |
          node ../control/scripts/qa/phase4a-external-uat-gateway-check.mjs
          test "$(git rev-parse HEAD)" = 3e6c6463d27579a088cefb66e1834d2afdc643c8
          echo '1d23c99397e9cf417c44ed505e5756a5c50087300edfb93df6c4ed6f0469e7cb  public/assets/index-BQGspy0I.js' | sha256sum -c -
          curl --fail --location --retry 3 https://github.com/cloudflare/cloudflared/releases/download/2026.9.3/cloudflared-linux-amd64 -o "$RUNNER_TEMP/cloudflared"
          echo "77e26d8d900e0b8469f416239d14b5f296525fdf79fee6f511ef55609e3fbac2  $RUNNER_TEMP/cloudflared" | sha256sum -c -
          chmod 700 "$RUNNER_TEMP/cloudflared"
      - name: Start two fresh owner fixtures and two smoke clones with private HTTPS previews
        working-directory: candidate
        run: |
          mkdir -p "$RUNNER_TEMP/uat"
          for scenario in 1 2 3 4; do
            target=$((4389 + scenario)); gateway=$((4499 + scenario))
            key=$(node -e 'process.stdout.write(require("node:crypto").randomBytes(32).toString("base64url"))')
            echo "::add-mask::$key"
            (umask 077; printf '%s' "$key" > "$RUNNER_TEMP/uat/key-$scenario")
            if [ "$scenario" = 1 ] || [ "$scenario" = 3 ]; then qa_case=citrus-empty; else qa_case=mint-missing; fi
            BD_COST_UAT_SCENARIO="$qa_case" BD_COST_UAT_PORT="$target" node --import tsx scripts/management-cost-phase4a-owner-uat.ts > "$RUNNER_TEMP/uat/fixture-$scenario.log" 2>&1 &
            UAT_TARGET_PORT="$target" UAT_GATEWAY_PORT="$gateway" UAT_SCENARIO="$scenario" UAT_ACCESS_KEY="$key" UAT_ORIGIN_FILE="$RUNNER_TEMP/uat/origin-$scenario" node ../control/scripts/qa/phase4a-external-uat-gateway.mjs > "$RUNNER_TEMP/uat/gateway-$scenario.log" 2>&1 &
          done
          for scenario in 1 2 3 4; do
            target=$((4389 + scenario)); gateway=$((4499 + scenario))
            for attempt in $(seq 1 60); do
              if curl --silent --fail "http://127.0.0.1:$target/home" -o /dev/null; then break; fi
              sleep 1
            done
            curl --silent --fail "http://127.0.0.1:$target/home" -o /dev/null
            "$RUNNER_TEMP/cloudflared" tunnel --no-autoupdate --url "http://127.0.0.1:$gateway" --protocol http2 > "$RUNNER_TEMP/uat/tunnel-$scenario.log" 2>&1 &
          done
          python3 - <<'PY'
          import os, re, time, json, pathlib, datetime
          root = pathlib.Path(os.environ['RUNNER_TEMP']) / 'uat'
          links=[]
          for scenario in [1,2,3,4]:
            for attempt in range(120):
              log=(root/f'tunnel-{scenario}.log').read_text()
              match=re.search(r'https://[a-z0-9-]+\.trycloudflare\.com',log)
              if match: break
              time.sleep(1)
            if not match: raise RuntimeError('External tunnel unavailable')
            (root/f'origin-{scenario}').write_text(match[0])
            links.append({'scenario':scenario,'origin':match[0],'case':'citrus-empty' if scenario in [1,3] else 'mint-missing','ingredientName':'QA основа лимонада' if scenario in [1,3] else 'QA порция чая'})
          (root/'origins.json').write_text(json.dumps({'candidateCommit':'3e6c6463d27579a088cefb66e1834d2afdc643c8','startedAt':datetime.datetime.now(datetime.timezone.utc).isoformat(),'lifetime':'up to 5 hours from readiness, cancelled earlier only on user request','links':links},indent=2))
          PY
          node --input-type=module - <<'JS'
          import {readFileSync,writeFileSync} from 'node:fs';
          import {randomBytes,createCipheriv,publicEncrypt,constants} from 'node:crypto';
          const root=process.env.RUNNER_TEMP+'/uat';
          const access=JSON.parse(readFileSync(root+'/origins.json'));
          for(const link of access.links) link.url=link.origin+'/start#'+readFileSync(root+'/key-'+link.scenario,'utf8');
          writeFileSync(root+'/private-access.json',JSON.stringify(access),{mode:0o600});
          const key=randomBytes(32),iv=randomBytes(12),cipher=createCipheriv('aes-256-gcm',key,iv);
          const ciphertext=Buffer.concat([cipher.update(JSON.stringify(access),'utf8'),cipher.final()]);
          const wrappedKey=publicEncrypt({key:readFileSync('../control/scripts/qa/phase4a-owner-uat-public-key.pub'),padding:constants.RSA_PKCS1_OAEP_PADDING,oaepHash:'sha256'},key);
          writeFileSync(root+'/encrypted-access.json',JSON.stringify({wrappedKey:wrappedKey.toString('base64'),iv:iv.toString('base64'),ciphertext:ciphertext.toString('base64'),tag:cipher.getAuthTag().toString('base64')}));
          JS
      - name: Verify local and external gateway entry before browser
        working-directory: candidate
        run: |
          node --input-type=module - <<'JS'
          import{readFileSync}from'node:fs';
          const root=process.env.RUNNER_TEMP+'/uat',access=JSON.parse(readFileSync(root+'/private-access.json'));
          for(const link of access.links){
            const key=readFileSync(root+'/key-'+link.scenario,'utf8');
            for(const base of ['http://127.0.0.1:'+(4499+link.scenario),link.origin]){
              let response, lastError;
              for(let attempt=0;attempt<45;attempt++){
                try{
                  response=await fetch(base+'/__uat/session',{method:'POST',headers:{Origin:link.origin,'Content-Type':'application/json'},body:JSON.stringify({key}),signal:AbortSignal.timeout(10000)});
                  if(response.status<500)break;
                }catch(error){lastError=error;}
                await new Promise(resolve=>setTimeout(resolve,2000));
              }
              if(!response)throw lastError;
              console.log('QA gateway entry',link.scenario,base,response.status,(await response.text()).slice(0,200));
              if(response.status!==204)throw new Error('QA gateway entry failed');
            }
          }
          JS
      - name: Install Chromium for external preview acceptance
        working-directory: candidate
        run: npm run browser:install
      - name: External HTTPS private access and real mobile editor verification smoke
        working-directory: candidate
        env:
          UAT_ACCESS_FILE: ${{ runner.temp }}/uat/private-access.json
          UAT_EVIDENCE_DIR: ${{ runner.temp }}/uat/evidence
        run: node ../control/scripts/qa/phase4a-external-uat-smoke.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qa-gateway-diagnostics
          path: ${{ runner.temp }}/uat/gateway-*.log
          retention-days: 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: external-uat-preview-smoke
          path: ${{ runner.temp }}/uat/evidence
          retention-days: 2
      - uses: actions/upload-artifact@v4
        with:
          name: private-owner-uat-access
          path: ${{ runner.temp }}/uat/encrypted-access.json
          retention-days: 1
      - name: Keep temporary QA preview available for owner UAT
        run: |
          echo 'Two clean owner QA scenarios ready; two separate clones passed external smoke. Production is untouched.'
          end=$((SECONDS + 18000))
          while [ "$SECONDS" -lt "$end" ]; do
            for scenario in 1 2 3 4; do
              target=$((4389 + scenario)); gateway=$((4499 + scenario))
              curl --silent --fail "http://127.0.0.1:$target/home" -o /dev/null
              curl --silent --fail "http://127.0.0.1:$gateway/start" -o /dev/null
            done
            sleep 45
          done
